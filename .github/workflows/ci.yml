name: Build

on:
  push:
    branches:
      - master
      - refactor-build-assets
  pull_request_target:
    branches:
      - master
      - refactor-build-assets

jobs:
  build_repo:
    name: Build repo
    runs-on: ubuntu-latest

    strategy:
        fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'
        ref: ${{ github.event.pull_request.head.sha }}

    - name: fix submodule repos
      run: git submodule update --remote

    - name: Install package requirements
      run: ./install.sh

    - name: Get extra deps
      uses: actions/checkout@v3
      with:
        repository: ${{ secrets.SECRETREPO }}
        token: ${{ secrets.SECRETREPOKEY }}
        path: deps_repo
    - name: Get the dep
      run: cp deps_repo/chameleon/* .

    - name: Setup
      run: ./configure

    - name: Build Chameleon Twist
      run: ./configure && ninja

    - name: Generate progress report (decomp.dev)
      run: |
        curl -sL https://github.com/encounter/objdiff/releases/download/v3.8.0/objdiff-cli-linux-x86_64 -o /tmp/objdiff-cli
        chmod +x /tmp/objdiff-cli
        python3 tools/gen_objdiff_report.py
        /tmp/objdiff-cli report generate -o build/report.json

    - name: Upload progress report
      uses: actions/upload-artifact@v4
      with:
        name: jp_report
        path: build/report.json